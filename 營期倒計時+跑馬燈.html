<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CASE 2897 統合調查終端機</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ==========================================
       全域重置與基礎設定
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      font-family: 'Share Tech Mono', monospace, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }

    /* 外層共用米灰色大檔案框 (dossier-shell) */
    .dossier-shell {
      width: 100%;
      max-width: 820px;
      border-radius: 8px;
      padding: 14px 18px 16px 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      background-color: #F7F6F3;
      border: 1px solid rgba(55, 53, 47, 0.16);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .dossier-shell {
        background-color: #1A1A18;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
    }
    body.force-dark .dossier-shell {
      background-color: #1A1A18;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    body.force-light .dossier-shell {
      background-color: #F7F6F3;
      border: 1px solid rgba(55, 53, 47, 0.16);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* 頂部最新線報列 */
    .shell-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .shell-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-family: 'Share Tech Mono', monospace, sans-serif;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dossier-shell .shell-title {
      color: #37352F;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .dossier-shell .shell-title {
        color: #E6EDF3;
      }
    }
    body.force-dark .dossier-shell .shell-title {
      color: #E6EDF3;
    }
    body.force-light .dossier-shell .shell-title {
      color: #37352F;
    }

    .shell-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      transition: opacity 0.2s;
    }

    .dossier-shell .ctrl-btn {
      color: #37352F;
      background-color: rgba(55, 53, 47, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .dossier-shell .ctrl-btn {
        color: #E6EDF3;
        background-color: rgba(255, 255, 255, 0.08);
      }
    }
    body.force-dark .dossier-shell .ctrl-btn {
      color: #E6EDF3;
      background-color: rgba(255, 255, 255, 0.08);
    }
    body.force-light .dossier-shell .ctrl-btn {
      color: #37352F;
      background-color: rgba(55, 53, 47, 0.06);
    }

    .ctrl-btn:hover { opacity: 0.8; }

    #lightbulbIcon {
      transition: filter 0.3s ease, fill 0.3s ease;
    }
    body.force-dark #lightbulbIcon {
      fill: rgba(230, 237, 243, 0.35);
    }
    body.force-light #lightbulbIcon {
      fill: #F59E0B;
      filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.6));
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light):not(.force-dark) #lightbulbIcon {
        fill: rgba(230, 237, 243, 0.35);
      }
    }
    @media (prefers-color-scheme: light) {
      body:not(.force-light):not(.force-dark) #lightbulbIcon {
        fill: #F59E0B;
        filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.6));
      }
    }

    /* 內部左右並排雙欄容器 (3 比 2 比例) */
    .dossier-columns {
      display: flex;
      align-items: stretch;
      gap: 12px;
      position: relative;
    }
    @media (max-width: 768px) {
      .dossier-columns {
        flex-direction: column;
      }
      .column-divider {
        display: none;
      }
    }

    /* 左欄 (佔 3 份) */
    .col-left {
      flex: 3;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 右欄 (佔 2 份) */
    .col-right {
      flex: 2;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 中間細緻垂直分隔線 */
    .column-divider {
      width: 1px;
      background-color: rgba(55, 53, 47, 0.12);
      align-self: stretch;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .column-divider { background-color: rgba(255, 255, 255, 0.12); }
    }
    body.force-dark .column-divider { background-color: rgba(255, 255, 255, 0.12); }

    /* ==========================================
       左側：神秘調查局終端機跑馬燈
       ========================================== */
    .terminal-box {
      width: 100%;
      height: 132px;
      background-color: #0E1112;
      border: 1px solid #1F292E;
      color: #00FF66;
      box-shadow: inset 0 0 14px rgba(0, 255, 102, 0.06);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 255, 102, 0.2);
      padding-bottom: 4px;
      position: relative;
      z-index: 5;
    }

    .terminal-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .green-glow-dot {
      width: 6px;
      height: 6px;
      background-color: #00FF66;
      border-radius: 50%;
      box-shadow: 0 0 6px #00FF66;
      display: inline-block;
    }

    .terminal-body {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      flex: 1;
    }

    .terminal-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-icon {
      font-family: 'DotGothic16', monospace;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 2px;
    }
    .badge-motive { background: rgba(255, 184, 108, 0.2); color: #FFB86C; border: 1px solid #FFB86C; }
    .badge-benefit { background: rgba(100, 255, 218, 0.2); color: #64FFDA; border: 1px solid #64FFDA; }
    .badge-final { background: rgba(255, 110, 110, 0.2); color: #FF6E6E; border: 1px solid #FF6E6E; }

    .terminal-card-title {
      font-family: 'DotGothic16', monospace;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
    }

    .marquee-viewport {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      mask-image: linear-gradient(90deg, transparent 0%, #000 3%, #000 97%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 3%, #000 97%, transparent 100%);
    }

    .marquee-track {
      display: inline-flex;
      align-items: center;
      width: max-content;
      will-change: transform;
    }

    .marquee-item {
      display: inline-flex;
      align-items: center;
      font-size: 11.5px;
      font-family: 'DotGothic16', monospace;
      padding-right: 40px;
      letter-spacing: 0.04em;
      text-shadow: 0 0 4px rgba(0, 255, 102, 0.25);
    }

    .terminal-code {
      display: inline-flex;
      align-items: center;
      padding: 1px 4px;
      margin: 0 3px;
      font-size: 11.5px;
      font-family: 'DotGothic16', monospace;
      background-color: rgba(255, 204, 0, 0.18);
      color: #FFCC00;
      border: 1px dashed rgba(255, 204, 0, 0.5);
    }

    .final-content-view {
      display: none;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      font-size: 11.5px;
      font-family: 'DotGothic16', monospace;
      letter-spacing: 0.04em;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
      white-space: nowrap;
      position: relative;
      z-index: 5;
    }

    @keyframes popZoom {
      0% { transform: scale(0.75); opacity: 0; filter: brightness(1); }
      50% { transform: scale(1.12); opacity: 1; filter: brightness(1.3); }
      100% { transform: scale(1); opacity: 1; filter: brightness(1); }
    }

    .pop-active {
      animation: popZoom 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .pop-highlight {
      display: inline-block;
      background-color: rgba(255, 110, 110, 0.25);
      color: #FF6E6E;
      border: 1px dashed rgba(255, 110, 110, 0.6);
      padding: 0 4px;
      border-radius: 2px;
    }

    .dust-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      width: 100%;
      height: 100%;
    }


    /* ==========================================
       右側：CASE 2897 案件偵查進度
       ========================================== */
    .case-card-box {
      width: 100%;
      height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .case-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .case-title {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      font-weight: 500;
      color: #37352F;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-title { color: #E6EDF3; }
    }
    body.force-dark .case-title { color: #E6EDF3; }

    /* 偵查中閃爍綠燈標籤 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 10.5px;
      font-weight: 500;
      background-color: rgba(16, 185, 129, 0.15);
      color: #047857;
      border: 1px solid rgba(16, 185, 129, 0.3);
      flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .status-badge { background-color: rgba(16, 185, 129, 0.2); color: #34D399; }
    }
    body.force-dark .status-badge { background-color: rgba(16, 185, 129, 0.2); color: #34D399; }

    @keyframes lightBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .blinking-dot {
      width: 6px;
      height: 6px;
      background-color: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 5px #10B981;
      animation: lightBlink 1.2s infinite ease-in-out;
      display: inline-block;
    }

    /* 左右並排小方框 */
    .case-metrics-grid {
      display: flex;
      gap: 6px;
    }

    .case-sub-card {
      flex: 1;
      background-color: #FAF7F2;
      border: 1px solid rgba(55, 53, 47, 0.08);
      border-radius: 4px;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-sub-card { background-color: #1A1A18; border-color: rgba(255, 255, 255, 0.08); }
    }
    body.force-dark .case-sub-card { background-color: #1A1A18; border-color: rgba(255, 255, 255, 0.08); }

    .case-sub-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .case-sub-label {
      font-size: 10.5px;
      color: #5C5346;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-sub-label { color: #A09B90; }
    }
    body.force-dark .case-sub-label { color: #A09B90; }

    .case-sub-val-wrap {
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .case-sub-number {
      font-size: 16px;
      font-weight: 700;
      color: #37352F;
      line-height: 1;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-sub-number { color: #F3F4F6; }
    }
    body.force-dark .case-sub-number { color: #F3F4F6; }

    .case-sub-unit {
      font-size: 10.5px;
      color: #5C5346;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-sub-unit { color: #A09B90; }
    }
    body.force-dark .case-sub-unit { color: #A09B90; }

    .case-sub-date {
      font-size: 9.5px;
      color: #78716C;
      text-align: center;
      margin-top: 2px;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-sub-date { color: #8E8882; }
    }
    body.force-dark .case-sub-date { color: #8E8882; }

    /* 下方進度條與細分隔線 */
    .case-progress-wrap {
      border-top: 1px solid rgba(55, 53, 47, 0.08);
      padding-top: 3px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-progress-wrap { border-top-color: rgba(255, 255, 255, 0.08); }
    }
    body.force-dark .case-progress-wrap { border-top-color: rgba(255, 255, 255, 0.08); }

    .case-prog-info {
      display: flex;
      justify-content: space-between;
      font-size: 9.5px;
      color: #78716C;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-prog-info { color: #8E8882; }
    }
    body.force-dark .case-prog-info { color: #8E8882; }

    .case-prog-bg {
      width: 100%;
      height: 3.5px;
      background-color: rgba(55, 53, 47, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-prog-bg { background-color: rgba(255, 255, 255, 0.12); }
    }
    body.force-dark .case-prog-bg { background-color: rgba(255, 255, 255, 0.12); }

    .case-prog-fill {
      height: 100%;
      background-color: #5C5346;
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .case-prog-fill { background-color: #D1CBC1; }
    }
    body.force-dark .case-prog-fill { background-color: #D1CBC1; }

    /* 結案完畢畫面 */
    .case-completion-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 2px;
    }
    .comp-title {
      font-size: 16px;
      font-weight: 700;
      color: #37352F;
      letter-spacing: 0.06em;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .comp-title { color: #F3F4F6; }
    }
    body.force-dark .comp-title { color: #F3F4F6; }

    .comp-sub {
      font-size: 11.5px;
      color: #5C5346;
      letter-spacing: 0.04em;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .comp-sub { color: #A09B90; }
    }
    body.force-dark .comp-sub { color: #A09B90; }

    @keyframes textBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .blinking-text {
      animation: textBlink 1.2s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- 外層共用米灰色大檔案框 -->
  <div class="dossier-shell" id="dossierShell">
    
    <!-- 頂部最新線報列 -->
    <div class="shell-top-bar">
      <div class="shell-title">
        <span style="display:inline-flex; align-items:center; color:#EB5757; font-size:13px; margin-right:2px;">🚩</span>
        <span>最新線報 - 調查目標已加入 40 天 Notion 訓練營，試圖建立腦內秩序。</span>
      </div>
      <div class="shell-controls">
        <button id="themeToggleBtn" class="ctrl-btn" title="切換顯示主題">
          <svg id="lightbulbIcon" width="13" height="13" viewBox="0 0 24 24">
            <path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/>
          </svg>
        </button>
        <button id="restartBtn" class="ctrl-btn" title="重新初始化">
          <span>🔄 重置</span>
        </button>
      </div>
    </div>

    <!-- 內部左右並排雙欄 (3 比 2 比例) 與垂直分隔線 -->
    <div class="dossier-columns">
      
      <!-- 左欄：神秘調查局終端機跑馬燈 (佔 3 份) -->
      <div class="col-left">
        <div class="terminal-box" id="terminalCard" title="點擊切換解密進度，滑鼠移入定格">
          <canvas class="dust-canvas" id="dustCanvas"></canvas>
          
          <div class="terminal-header">
            <div class="terminal-status">
              <span class="green-glow-dot"></span>
              <span id="termStatusLabel">解密進度 0%</span>
            </div>
            <div style="font-size: 11px; color: #00FF66;" class="blinking-text" id="termStepLabel">開始初始化</div>
          </div>

          <div class="terminal-body" id="terminalBodyRunning">
            <div class="terminal-title-row">
              <span class="badge-icon badge-motive" id="termBadge">[01]</span>
              <span class="terminal-card-title" id="termTitle">推測動機 // CLASSIFIED</span>
            </div>
            <div class="marquee-viewport" id="marqueeViewport">
              <div class="marquee-track" id="marqueeTrack"></div>
            </div>
          </div>

          <div class="final-content-view" id="finalContentView">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
              <span class="badge-icon badge-final">★</span>
              <span class="terminal-card-title" style="color: #FF6E6E; text-shadow: 0 0 5px rgba(255,110,110,0.4);">解密成功 // WELCOME</span>
            </div>
            <div>解密成功，歡迎進入 <span class="pop-highlight">哞哞的腦內世界</span>，準備解鎖全新的 2026 生活系統！</div>
          </div>
        </div>
      </div>

      <!-- 中間細緻垂直分隔線 -->
      <div class="column-divider"></div>

      <!-- 右欄：CASE 2897 案件偵查進度 (佔 2 份) -->
      <div class="col-right">
        <div class="case-card-box">
          
          <!-- 偵查中畫面 -->
          <div id="caseRunningView" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
            <div class="case-top-row">
              <div class="case-title">
                <span style="display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; background:rgba(92,83,70,0.1); border-radius:3px; color:#5C5346;">🔍</span>
                <span>CASE 2897 · 偵查進度</span>
              </div>
              <div class="status-badge" id="caseStatusBadge">
                <span class="blinking-dot" id="caseDot"></span>
                <span id="caseStatusText">偵查中</span>
              </div>
            </div>

            <div class="case-metrics-grid">
              <!-- 累積偵查天數 -->
              <div class="case-sub-card">
                <div class="case-sub-top">
                  <span class="case-sub-label">累積偵查天數</span>
                  <div class="case-sub-val-wrap">
                    <span class="case-sub-number" id="elapsedDays">25</span>
                    <span class="case-sub-unit">天</span>
                  </div>
                </div>
                <div class="case-sub-date">自 2026.10.22起</div>
              </div>

              <!-- 距離預定結案 -->
              <div class="case-sub-card">
                <div class="case-sub-top">
                  <span class="case-sub-label">距離預定結案</span>
                  <div class="case-sub-val-wrap">
                    <span class="case-sub-number" id="remainingDays">16</span>
                    <span class="case-sub-unit">天</span>
                  </div>
                </div>
                <div class="case-sub-date">2026.12.01 結案</div>
              </div>
            </div>

            <div class="case-progress-wrap">
              <div class="case-prog-info">
                <span>時程偵查進度</span>
                <span id="caseProgressPct">60%</span>
              </div>
              <div class="case-prog-bg">
                <div class="case-prog-fill" id="progressBarFill" style="width: 60%;"></div>
              </div>
            </div>
          </div>

          <!-- 結案完畢畫面 -->
          <div class="case-completion-view" id="caseCompletionView">
            <div class="comp-title">恭喜結案</div>
            <div class="comp-sub">嫌疑人無罪釋放</div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script>
    // ---------------------------------------------------------
    // 左側終端機跑馬燈邏輯
    // ---------------------------------------------------------
    const TOPICS = [
      {
        title: "推測動機 // CLASSIFIED",
        badgeClass: "badge-motive",
        particleColor: "#FFB86C",
        icon: "[01]",
        segments: [
          { text: "目標疑似 " },
          { code: "做事沒有系統流程" },
          { text: "，人生過於混亂，報名訓練營想在 2026 年 " },
          { code: "建立Life系統" },
          { text: "，享受慵懶生活。" }
        ]
      },
      {
        title: "預期收益 // TARGET",
        badgeClass: "badge-benefit",
        particleColor: "#64FFDA",
        icon: "[02]",
        segments: [
          { text: "目標預期在 Notion 訓練營結識智慧夥伴，" },
          { code: "打破自我框架" },
          { text: "，" },
          { code: "拓寬眼界" },
          { text: "，過上理想生活。" }
        ]
      },
      {
        title: "解密成功 // WELCOME",
        badgeClass: "badge-final",
        particleColor: "#FF6E6E",
        icon: "★",
        isFinal: true
      }
    ];

    const terminalCard = document.getElementById('terminalCard');
    const termBadge = document.getElementById('termBadge');
    const termTitle = document.getElementById('termTitle');
    const terminalBodyRunning = document.getElementById('terminalBodyRunning');
    const finalContentView = document.getElementById('finalContentView');
    const marqueeViewport = document.getElementById('marqueeViewport');
    const marqueeTrack = document.getElementById('marqueeTrack');
    const termStatusLabel = document.getElementById('termStatusLabel');
    const termStepLabel = document.getElementById('termStepLabel');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const restartBtn = document.getElementById('restartBtn');
    const dustCanvas = document.getElementById('dustCanvas');
    const ctx = dustCanvas.getContext('2d');

    let currentTermIndex = 0;
    let isTermPaused = false;
    let isTermTransitioning = false;
    let termScrollX = 0;
    let termGroupWidth = 0;
    let termMaxDist = 0;
    let termLastTs = null;
    let termPauseElapsed = 0;
    let termScrollElapsed = 0;
    let termDuration = 0;
    let particles = [];

    function createSpans(text, container) {
      for (const ch of text) {
        const s = document.createElement('span');
        s.style.display = 'inline-block';
        s.textContent = ch === ' ' ? '\u00A0' : ch;
        container.appendChild(s);
      }
    }

    function buildGroup(segments, isClone = false) {
      const g = document.createElement('span');
      g.className = 'marquee-item';
      if (isClone) g.setAttribute('aria-hidden', 'true');

      segments.forEach(seg => {
        if (seg.code) {
          const c = document.createElement('code');
          c.className = 'terminal-code';
          createSpans(seg.code, c);
          g.appendChild(c);
        } else if (seg.text) {
          createSpans(seg.text, g);
        }
      });
      return g;
    }

    function recalcTerm() {
      if (TOPICS[currentTermIndex].isFinal) return;
      const first = marqueeTrack.querySelector('.marquee-item');
      if (!first) return;
      termGroupWidth = first.getBoundingClientRect().width;
      termMaxDist = currentTermIndex === 0 ? termGroupWidth * 0.5 : termGroupWidth;
      termDuration = termMaxDist / 26;
    }

    function updateTermStatus(pct) {
      const t = TOPICS[currentTermIndex];
      if (t.isFinal) {
        termStatusLabel.textContent = '同步連線中';
        termStepLabel.textContent = '初始化完成';
        termStepLabel.classList.remove('blinking-text');
      } else {
        const p = Math.min(100, Math.round(pct));
        termStatusLabel.textContent = '解密進度 ' + p + '%';
        termStepLabel.textContent = '解密中...';
        termStepLabel.classList.add('blinking-text');
      }
    }

    function renderTerminalTopic(idx) {
      currentTermIndex = idx;
      const t = TOPICS[idx];

      if (t.isFinal) {
        terminalBodyRunning.style.display = 'none';
        finalContentView.style.display = 'flex';
        finalContentView.classList.remove('pop-active');
        void finalContentView.offsetWidth; //觸發重繪
        finalContentView.classList.add('pop-active');
        
        termStatusLabel.textContent = '同步連線中';
        termStepLabel.textContent = '初始化完成';
        termStepLabel.classList.remove('blinking-text');
      } else {
        terminalBodyRunning.style.display = 'flex';
        finalContentView.style.display = 'none';
        finalContentView.classList.remove('pop-active');

        termBadge.className = 'badge-icon ' + t.badgeClass;
        termBadge.textContent = t.icon;
        termTitle.textContent = t.title;

        marqueeTrack.innerHTML = '';
        marqueeTrack.appendChild(buildGroup(t.segments, false));
        marqueeTrack.appendChild(buildGroup(t.segments, true));

        termPauseElapsed = 0;
        termScrollX = 0;
        termScrollElapsed = 0;
        marqueeTrack.style.transform = 'translate3d(0px,0,0)';
        recalcTerm();

        let basePct = idx === 1 ? 50 : 0;
        updateTermStatus(basePct);
      }
    }

    function spawnDust(color) {
      const rect = terminalCard.getBoundingClientRect();
      dustCanvas.width = rect.width * (window.devicePixelRatio || 1);
      dustCanvas.height = rect.height * (window.devicePixelRatio || 1);
      ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);

      particles = [];
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: Math.random() * rect.width,
          y: Math.random() * rect.height,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          size: 1 + Math.random() * 2,
          alpha: 0.8,
          decay: 0.02 + Math.random() * 0.02,
          color: Math.random() > 0.3 ? color : '#00FF66'
        });
      }
    }

    function nextTerminalTopic() {
      if (isTermTransitioning) return;
      isTermTransitioning = true;
      const next = (currentTermIndex + 1) % TOPICS.length;
      spawnDust(TOPICS[currentTermIndex].particleColor || '#FF6E6E');
      setTimeout(() => {
        renderTerminalTopic(next);
        isTermTransitioning = false;
      }, 400);
    }

    function terminalLoop(timestamp) {
      if (!termLastTs) termLastTs = timestamp;
      const dt = (timestamp - termLastTs) / 1000;
      termLastTs = timestamp;

      if (particles.length > 0) {
        ctx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;
          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1;
      }

      if (!isTermPaused && !isTermTransitioning) {
        const t = TOPICS[currentTermIndex];
        if (t.isFinal) {
          // Final state stays
        } else if (termGroupWidth > 0) {
          if (termPauseElapsed < 1.0) {
            termPauseElapsed += dt;
          } else {
            termScrollX += 26 * dt;
            termScrollElapsed += dt;
            marqueeTrack.style.transform = 'translate3d(-' + Math.min(termMaxDist, termScrollX) + 'px,0,0)';

            const prog = Math.min(1, termScrollElapsed / termDuration);
            let globalPct = currentTermIndex === 0 ? prog * 50 : 50 + prog * 50;
            updateTermStatus(globalPct);
          }

          if (termScrollX >= termMaxDist) {
            nextTerminalTopic();
          }
        }
      }

      requestAnimationFrame(terminalLoop);
    }


    // ---------------------------------------------------------
    // 右側：CASE 2897 案件偵查進度日期動態計算邏輯
    // ---------------------------------------------------------
    function updateCaseWidget() {
      const startDate = new Date(2026, 9, 22); // 2026-10-22
      const endDate = new Date(2026, 11, 1);   // 2026-12-01
      const now = new Date();

      const totalTime = endDate.getTime() - startDate.getTime();
      const totalDays = Math.round(totalTime / (1000 * 60 * 60 * 24)) + 1;

      const elapsedTime = now.getTime() - startDate.getTime();
      let currentElapsedDays = Math.floor(elapsedTime / (1000 * 60 * 60 * 24)) + 1;
      if (currentElapsedDays < 1) currentElapsedDays = 1;

      const remainingTime = endDate.getTime() - now.getTime();
      let currentRemainingDays = Math.ceil(remainingTime / (1000 * 60 * 60 * 24));

      let progressPercent = Math.round((currentElapsedDays / totalDays) * 100);
      if (progressPercent > 100) progressPercent = 100;
      if (progressPercent < 0) progressPercent = 0;

      const isCompleted = now >= endDate || currentRemainingDays <= 0;

      const caseRunningView = document.getElementById('caseRunningView');
      const caseCompletionView = document.getElementById('caseCompletionView');
      const caseStatusText = document.getElementById('caseStatusText');
      const caseStatusBadge = document.getElementById('caseStatusBadge');
      const caseDot = document.getElementById('caseDot');

      if (isCompleted) {
        caseRunningView.style.display = 'none';
        caseCompletionView.style.display = 'flex';
        caseStatusText.textContent = '偵查完畢';
        caseStatusBadge.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
        caseStatusBadge.style.color = '#047857';
        caseStatusBadge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
        if (caseDot) {
          caseDot.style.animation = 'none';
          caseDot.style.backgroundColor = '#10B981';
          caseDot.style.boxShadow = '0 0 5px #10B981';
        }
      } else {
        caseRunningView.style.display = 'flex';
        caseCompletionView.style.display = 'none';
        caseStatusText.textContent = '偵查中';
        document.getElementById('elapsedDays').textContent = currentElapsedDays;
        document.getElementById('remainingDays').textContent = Math.max(0, currentRemainingDays);
        document.getElementById('caseProgressPct').textContent = progressPercent + '%';
        document.getElementById('progressBarFill').style.width = progressPercent + '%';
      }
    }

    // 初始化執行
    renderTerminalTopic(0);
    requestAnimationFrame(terminalLoop);
    updateCaseWidget();

    // 互動事件綁定
    terminalCard.addEventListener('mouseenter', () => { isTermPaused = true; });
    terminalCard.addEventListener('mouseleave', () => { isTermPaused = false; });
    terminalCard.addEventListener('click', () => { nextTerminalTopic(); });

    restartBtn.addEventListener('click', () => {
      renderTerminalTopic(0);
    });

    themeToggleBtn.addEventListener('click', () => {
      const body = document.body;
      if (body.classList.contains('force-dark')) {
        body.classList.remove('force-dark');
        body.classList.add('force-light');
      } else if (body.classList.contains('force-light')) {
        body.classList.remove('force-light');
      } else {
        body.classList.add('force-dark');
      }
    });

    window.addEventListener('resize', () => recalcTerm());
  </script>
</body>
</html>
