<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CASE 2897 統合調查終端機</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      font-family: 'Share Tech Mono', monospace, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 8px;
      width: 100vw;
      overflow-x: hidden;
    }

    /* 共用大白框（米灰色檔案殼），採用指定配色 #FAF7F2 背景、#EAE3DC 框線、#5C5346 文字 */
    .dossier-shell {
      width: 100%;
      max-width: 100%;
      border-radius: 8px;
      padding: 12px 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: #FAF7F2;
      border: 1px solid #EAE3DC;
      color: #5C5346;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .dossier-shell {
        background-color: #1A1A18;
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #E6EDF3;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
    }
    body.force-dark .dossier-shell {
      background-color: #1A1A18;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #E6EDF3;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    body.force-light .dossier-shell {
      background-color: #FAF7F2;
      border: 1px solid #EAE3DC;
      color: #5C5346;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* 雙欄 4:3 佈局，使用 min-width: 0 防止 flex 溢出 */
    .dual-container {
      display: flex;
      align-items: stretch;
      gap: 12px;
      width: 100%;
      min-width: 0;
    }

    /* 手機版響應式斷點 (max-width: 680px)：自動上下堆疊 */
    @media (max-width: 680px) {
      .dual-container {
        flex-direction: column;
      }
      .right-column {
        border-left: none !important;
        border-top: 1px solid #EAE3DC;
        padding-left: 0 !important;
        padding-top: 12px !important;
      }
    }

    /* 共用頂部同行對齊行 (高度 28px) */
    .top-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 28px;
      width: 100%;
      min-width: 0;
    }

    /* 左側欄位 (比例 4) */
    .left-column {
      flex: 4;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .shell-title {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-family: 'Share Tech Mono', monospace, sans-serif;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #5C5346;
      min-width: 0;
      flex: 1;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .dossier-shell .shell-title { color: #E6EDF3; }
    }
    body.force-dark .dossier-shell .shell-title { color: #E6EDF3; }
    body.force-light .dossier-shell .shell-title { color: #5C5346; }

    .shell-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    /* 純圖示按鈕 (燈泡與重新初始化) */
    .icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      background-color: rgba(92, 83, 70, 0.08);
      color: #5C5346;
      flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .icon-btn {
        color: #E6EDF3;
        background-color: rgba(255, 255, 255, 0.08);
      }
    }
    body.force-dark .icon-btn {
      color: #E6EDF3;
      background-color: rgba(255, 255, 255, 0.08);
    }
    body.force-light .icon-btn {
      color: #5C5346;
      background-color: rgba(92, 83, 70, 0.08);
    }
    .icon-btn:hover { opacity: 0.8; }

    #lightbulbIcon {
      transition: filter 0.3s ease, color 0.3s ease;
    }
    body.force-dark #lightbulbIcon,
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) #lightbulbIcon {
        color: #888884;
        filter: drop-shadow(0 0 0px transparent);
      }
    }
    body.force-light #lightbulbIcon {
      color: #D97706;
      filter: drop-shadow(0 0 5px rgba(217, 119, 6, 0.6));
    }
    body:not(.force-dark):not(.force-light) #lightbulbIcon {
      color: #D97706;
      filter: drop-shadow(0 0 5px rgba(217, 119, 6, 0.6));
    }
    body.force-dark #lightbulbIcon {
      color: #888884;
      filter: drop-shadow(0 0 0px transparent);
    }

    /* 左側終端機卡片 (高度 176px 舒適寬敞) */
    .widget-card {
      width: 100%;
      height: 176px;
      position: relative;
      background-color: #0E1112;
      border: 1px solid #1F292E;
      color: #00FF66;
      box-shadow: inset 0 0 16px rgba(0, 255, 102, 0.08);
      border-radius: 6px;
      padding: 12px 32px 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      image-rendering: pixelated;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 5;
    }

    .title-icon-badge {
      width: 20px;
      height: 20px;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'DotGothic16', monospace;
      font-size: 11px;
    }
    .badge-motive { background-color: rgba(255, 184, 108, 0.2); color: #FFB86C; border: 1px solid #FFB86C; }
    .badge-benefit { background-color: rgba(100, 255, 218, 0.2); color: #64FFDA; border: 1px solid #64FFDA; }
    .badge-final { background-color: rgba(255, 110, 110, 0.2); color: #FF6E6E; border: 1px solid #FF6E6E; }

    .card-title {
      font-size: 17.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-family: 'DotGothic16', monospace;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .marquee-viewport {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      z-index: 5;
      mask-image: linear-gradient(90deg, transparent 0%, #000 3%, #000 97%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 3%, #000 97%, transparent 100%);
    }

    .marquee-track {
      display: inline-flex;
      align-items: center;
      width: max-content;
      will-change: transform;
    }

    .marquee-item {
      display: inline-flex;
      align-items: center;
      font-size: 17px;
      line-height: 1.4;
      padding-right: 64px;
      font-family: 'DotGothic16', monospace;
      letter-spacing: 0.04em;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.3);
    }

    .final-content-view {
      display: none;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 5;
      font-size: 16px;
      font-family: 'DotGothic16', monospace;
      letter-spacing: 0.04em;
      white-space: normal;
      padding: 0 2px;
      text-shadow: 0 0 8px rgba(255, 110, 110, 0.5);
    }

    @keyframes popZoom {
      0% { transform: scale(0.7); opacity: 0; filter: brightness(1); }
      60% { transform: scale(1.15); opacity: 1; filter: brightness(1.4); }
      100% { transform: scale(1); opacity: 1; filter: brightness(1); }
    }

    .pop-highlight {
      display: inline-block;
      animation: popZoom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      background-color: rgba(255, 110, 110, 0.28);
      color: #FF6E6E;
      border: 1px dashed rgba(255, 110, 110, 0.7);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'DotGothic16', monospace;
      font-weight: bold;
    }

    .notion-code {
      display: inline-flex;
      align-items: center;
      border-radius: 2px;
      padding: 1px 5px;
      margin: 0 3px;
      font-size: 16.5px;
      font-family: 'DotGothic16', monospace;
      font-weight: 600;
      white-space: nowrap;
      background-color: rgba(255, 204, 0, 0.18);
      color: #FFCC00;
      border: 1px dashed rgba(255, 204, 0, 0.5);
      text-shadow: 0 0 5px rgba(255, 204, 0, 0.35);
    }

    .frag-char {
      display: inline-block;
      will-change: transform, opacity, filter;
    }
    .is-shattering .notion-code { background-color: transparent !important; border-color: transparent !important; }

    .dust-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }

    .dots-nav {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .dot {
      width: 3px;
      height: 3px;
      border-radius: 0px;
      transition: all 0.3s ease;
      cursor: pointer;
      background-color: rgba(0, 255, 102, 0.3);
    }
    .dot.active { background-color: #00FF66; height: 10px; }

    .progress-bar-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      overflow: hidden;
      z-index: 7;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #00FF66;
    }

    @keyframes textBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .blinking-text {
      animation: textBlink 1.2s infinite ease-in-out;
    }

    /* 右側欄位 (比例 3，高度對齊左側終端機黑框底部) */
    .right-column {
      flex: 3;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: transparent;
      border: none;
      border-left: 1px solid #EAE3DC;
      padding: 0 0 0 14px;
      color: #5C5346;
      position: relative;
    }

    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .right-column {
        border-left: 1px solid rgba(255, 255, 255, 0.12);
        color: #E6EDF3;
      }
    }
    body.force-dark .right-column {
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      color: #E6EDF3;
    }
    body.force-light .right-column {
      border-left: 1px solid #EAE3DC;
      color: #5C5346;
    }

    .case-title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 圓角方框米白放大鏡圖案徽章 (border-radius: 7px) */
    .magnifier-badge {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background-color: #EAE3DC;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(92, 83, 70, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .magnifier-badge {
        background-color: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    }
    body.force-dark .magnifier-badge {
      background-color: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .case-status-pill {
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .pill-active {
      background-color: rgba(46, 160, 67, 0.15);
      color: #2EA043;
      border: 1px solid rgba(46, 160, 67, 0.3);
    }

    .pill-finished {
      background-color: rgba(210, 153, 34, 0.15);
      color: #D97706;
      border: 1px solid rgba(210, 153, 34, 0.3);
    }

    .status-dot-green {
      width: 6px;
      height: 6px;
      background-color: #2EA043;
      border-radius: 50%;
      box-shadow: 0 0 5px #2EA043;
      animation: textBlink 1.5s infinite ease-in-out;
    }

    .status-dot-yellow {
      width: 6px;
      height: 6px;
      background-color: #D97706;
      border-radius: 50%;
      box-shadow: 0 0 5px #D97706;
    }

    /* 右側數據區塊：純垂直分隔線切分，不加獨立外框 */
    .metrics-row {
      display: flex;
      align-items: stretch;
      width: 100%;
      padding: 2px 0;
    }

    .metric-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2px 8px;
    }
    .metric-pane:first-child {
      padding-left: 0;
      border-right: 1px solid #EAE3DC;
    }
    .metric-pane:last-child {
      padding-right: 0;
      padding-left: 12px;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .metric-pane:first-child {
        border-right: 1px solid rgba(255, 255, 255, 0.15);
      }
    }
    body.force-dark .metric-pane:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }
    body.force-light .metric-pane:first-child {
      border-right: 1px solid #EAE3DC;
    }

    .metric-label {
      font-size: 15px;
      text-align: left;
      opacity: 0.85;
      margin-bottom: 2px;
      transform: translateY(-5px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value-row {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 3px;
    }

    .metric-number {
      font-size: 38px;
      font-weight: 700;
      font-family: 'DotGothic16', monospace;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .metric-unit {
      font-size: 18px;
      font-family: 'DotGothic16', monospace;
    }

    .metric-sub {
      font-size: 12.5px;
      text-align: center;
      margin-top: 16px;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 底部進度條：單行水平排列（左側標籤 + 中間進度條 + 最右下角百分比） */
    .timeline-footer {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .timeline-label {
      font-size: 12px;
      opacity: 0.85;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .timeline-track-bar {
      flex: 1;
      min-width: 40px;
      height: 6px;
      background-color: rgba(92, 83, 70, 0.16);
      border-radius: 3px;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .timeline-track-bar { background-color: rgba(255, 255, 255, 0.15); }
    }
    body.force-dark .timeline-track-bar { background-color: rgba(255, 255, 255, 0.15); }
    body.force-light .timeline-track-bar { background-color: rgba(92, 83, 70, 0.16); }

    .timeline-fill-bar {
      height: 100%;
      background-color: #5C5346;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.force-light) .timeline-fill-bar { background-color: #D4D4D0; }
    }
    body.force-dark .timeline-fill-bar { background-color: #D4D4D0; }
    body.force-light .timeline-fill-bar { background-color: #5C5346; }

    .timeline-percent {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.9;
      flex-shrink: 0;
      white-space: nowrap;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="dossier-shell" id="dossierShell">
    
    <!-- 雙欄 4:3 佈局本體 -->
    <div class="dual-container">
      
      <!-- 左側欄位 (比例 4) -->
      <div class="left-column">
        <!-- 頂部同行對齊行：最新線報與圖示按鈕群組 -->
        <div class="top-header-row">
          <div class="shell-title">
            <span style="color:#EB5757; font-size:14px; margin-right:2px; flex-shrink:0;">🚩</span>
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">最新線報 - 目標已加入 40 天 Notion 訓練營，試圖建立腦內秩序。</span>
          </div>
          <div class="shell-controls">
            <button id="themeToggleBtn" class="icon-btn" title="切換顯示主題">
              <svg id="lightbulbIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7M9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/>
              </svg>
            </button>
            <button id="restartBtn" class="icon-btn" title="重新初始化">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- 終端機跑馬燈卡片 -->
        <div class="widget-card" id="widgetCard" title="點擊強制轉場，滑鼠移入定格閱讀">
          <canvas class="dust-canvas" id="dustCanvas"></canvas>

          <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; position: relative; z-index: 10; border-bottom: 1px solid rgba(0,255,102,0.2); padding-bottom: 4px; margin-bottom: 2px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="width: 8px; height: 8px; background-color: #00FF66; border-radius: 50%; box-shadow: 0 0 6px #00FF66; display: inline-block;"></span>
              <span id="statusLabel" style="font-family: 'Share Tech Mono', monospace; font-size: 11.5px; color: #00FF66; white-space: nowrap;">解密進度 78%</span>
            </div>
            <div>
              <span id="stateStepLabel" style="font-family: 'Share Tech Mono', monospace; font-size: 11.5px; color: #00FF66; white-space: nowrap;" class="blinking-text">解密中...</span>
            </div>
          </div>

          <div class="card-header">
            <span class="title-icon-badge badge-benefit" id="iconBadge" aria-hidden="true"></span>
            <span class="card-title" id="cardTitle"></span>
          </div>

          <div class="marquee-viewport" id="marqueeViewport">
            <div class="marquee-track" id="marqueeTrack"></div>
          </div>

          <div class="final-content-view" id="finalContentView">
            解密成功，歡迎進入 <span class="pop-highlight" id="popupTarget">哞哞的腦內世界</span>，準備解鎖全新的 2026 生活系統！
          </div>

          <div class="dots-nav" id="dotsNav">
            <div class="dot active" data-index="0"></div>
            <div class="dot" data-index="1"></div>
            <div class="dot" data-index="2"></div>
          </div>

          <div class="progress-bar-wrap">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
      </div>

      <!-- 右側欄位 (比例 3) -->
      <div class="right-column">
        <!-- 頂部同行對齊行：米白放大鏡圖案徽章 (border-radius: 7px) + CASE 標題與偵查中狀態 -->
        <div class="top-header-row">
          <div class="case-title-area">
            <span class="magnifier-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <span>CASE 2897 · 偵查進度</span>
          </div>
          <div class="case-status-pill pill-active" id="caseStatusPill">
            <span class="status-dot-green" id="caseStatusDot"></span>
            <span id="caseStatusText">偵查中</span>
          </div>
        </div>

        <!-- 左右天數數據區塊（改用垂直分隔線切分，無獨立外框） -->
        <div class="metrics-row">
          <div class="metric-pane">
            <div class="metric-label">累積偵查天數</div>
            <div class="metric-value-row">
              <span class="metric-number" id="daysElapsed">25</span>
              <span class="metric-unit">天</span>
            </div>
            <div class="metric-sub">自 2026.10.22 起</div>
          </div>

          <div class="metric-pane">
            <div class="metric-label" id="rightLabel">距離預定結案</div>
            <div class="metric-value-row">
              <span class="metric-number" id="daysRemaining">16</span>
              <span class="metric-unit" id="rightUnit">天</span>
            </div>
            <div class="metric-sub" id="rightSub">2026.12.01 結案</div>
          </div>
        </div>

        <div class="timeline-footer">
          <span class="timeline-label">時程偵查進度</span>
          <div class="timeline-track-bar">
            <div class="timeline-fill-bar" id="timelineFillBar" style="width: 61%;"></div>
          </div>
          <span class="timeline-percent" id="progressPercentText">61%</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const TOPICS = [
      {
        title: "推測動機 // CLASSIFIED",
        badgeClass: "badge-motive",
        particleColor: "#FFB86C",
        iconSvg: '<span style="font-size:11px;">[01]</span>',
        segments: [
          { text: "目標疑似 " },
          { code: "做事沒有系統流程" },
          { text: "，人生過於混亂，嚴重影響生活品質，因此報名訓練營想在 2026 年 " },
          { code: "建立屬於自己的Life系統" },
          { text: "，希望過上輕鬆卻充實的慵懶生活。" }
        ]
      },
      {
        title: "預期收益 // TARGET",
        badgeClass: "badge-benefit",
        particleColor: "#64FFDA",
        iconSvg: '<span style="font-size:11px;">[02]</span>',
        segments: [
          { text: "目標預期在 Notion 訓練營結識智慧、有趣的人，" },
          { code: "打破自我框架" },
          { text: "，" },
          { code: "拓寬眼界" },
          { text: "，過上自己更喜歡的生活。" }
        ]
      },
      {
        title: "解密成功 // WELCOME",
        badgeClass: "badge-final",
        particleColor: "#FF6E6E",
        iconSvg: '<span style="font-size:11px;">★</span>',
        isFinal: true,
        segments: [
          { text: "🎉 " },
          { code: "解密成功" },
          { text: "，歡迎進入" },
          { code: "哞哞的腦內世界" },
          { tokenPopup: true, text: "，準備解鎖全新的 2026 生活系統！" }
        ]
      }
    ];

    const widgetCard = document.getElementById('widgetCard');
    const iconBadge = document.getElementById('iconBadge');
    const cardTitle = document.getElementById('cardTitle');
    const marqueeViewport = document.getElementById('marqueeViewport');
    const marqueeTrack = document.getElementById('marqueeTrack');
    const finalContentView = document.getElementById('finalContentView');
    const popupTarget = document.getElementById('popupTarget');
    const dots = document.querySelectorAll('.dot');
    const progressBar = document.getElementById('progressBar');
    const statusLabel = document.getElementById('statusLabel');
    const stateStepLabel = document.getElementById('stateStepLabel');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const restartBtn = document.getElementById('restartBtn');
    const dustCanvas = document.getElementById('dustCanvas');
    const ctx = dustCanvas.getContext('2d');

    const INITIAL_PAUSE_SEC = 1.0;
    const SCROLL_SPEED = 42; // 加快捲動速度

    let currentIndex = 0;
    let isPaused = false;
    let isTransitioning = false;
    let isFinished = false;
    let pauseElapsed = 0;
    let scrollX = 0;
    let singleGroupWidth = 0;
    let maxTriggerDistance = 0;
    let lastTimestamp = null;
    let particles = [];
    
    let topicScrollElapsed = 0;
    let topicScrollDuration = 0;

    function createCharSpans(text, targetContainer) {
      for (const ch of text) {
        const span = document.createElement('span');
        span.className = 'frag-char';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        targetContainer.appendChild(span);
      }
    }

    function buildMarqueeGroup(segments, isClone = false) {
      const group = document.createElement('span');
      group.className = 'marquee-item';
      if (isClone) group.setAttribute('aria-hidden', 'true');

      segments.forEach(seg => {
        if (seg.code) {
          const codeEl = document.createElement('code');
          codeEl.className = 'notion-code';
          createCharSpans(seg.code, codeEl);
          group.appendChild(codeEl);
        } else if (seg.text) {
          createCharSpans(seg.text, group);
        }
      });
      return group;
    }

    function recalculateScrollDistance() {
      const firstGroup = marqueeTrack.querySelector('.marquee-item');
      if (!firstGroup) return;
      singleGroupWidth = firstGroup.getBoundingClientRect().width;
      maxTriggerDistance = singleGroupWidth;
      topicScrollDuration = maxTriggerDistance / SCROLL_SPEED;
    }

    function updateHeaderStatus(pct) {
      const topic = TOPICS[currentIndex];
      if (topic.isFinal) {
        statusLabel.textContent = '同步連線中';
        stateStepLabel.textContent = '初始化完成';
        stateStepLabel.classList.remove('blinking-text');
      } else {
        const displayPct = Math.min(100, Math.round(pct));
        statusLabel.textContent = '解密進度 ' + displayPct + '%';
        stateStepLabel.textContent = '解密中...';
        stateStepLabel.classList.add('blinking-text');
      }
    }

    function renderTopic(index, assembleFromFragments = false) {
      const topic = TOPICS[index];
      currentIndex = index;

      iconBadge.className = 'title-icon-badge ' + topic.badgeClass;
      iconBadge.innerHTML = topic.iconSvg;
      cardTitle.innerHTML = '';
      createCharSpans(topic.title, cardTitle);

      if (topic.isFinal) {
        marqueeViewport.style.display = 'none';
        finalContentView.style.display = 'block';
        isFinished = true;
        popupTarget.style.animation = 'none';
        void popupTarget.offsetWidth;
        popupTarget.style.animation = 'popZoom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
      } else {
        marqueeViewport.style.display = 'block';
        finalContentView.style.display = 'none';
        isFinished = false;
        marqueeTrack.innerHTML = '';
        marqueeTrack.appendChild(buildMarqueeGroup(topic.segments, false));
        marqueeTrack.appendChild(buildMarqueeGroup(topic.segments, true));
      }

      pauseElapsed = 0;
      scrollX = 0;
      topicScrollElapsed = 0;
      if (!topic.isFinal) {
        marqueeTrack.style.transform = 'translate3d(0px, 0, 0)';
        recalculateScrollDistance();
      }

      dots.forEach((dot, idx) => dot.classList.toggle('active', idx === currentIndex));

      let basePct = (currentIndex === 0) ? 0 : 60;
      progressBar.style.width = basePct + '%';
      updateHeaderStatus(basePct);

      if (assembleFromFragments) {
        const targetQuery = topic.isFinal ? '.pop-highlight' : '.frag-char';
        const chars = widgetCard.querySelectorAll(targetQuery);
        iconBadge.style.transition = 'none';
        iconBadge.style.opacity = '0';
        iconBadge.style.transform = 'scale(0.3)';

        chars.forEach(span => {
          const rx = (Math.random() - 0.5) * 80;
          const ry = (Math.random() - 0.5) * 40;
          span.style.transition = 'none';
          span.style.opacity = '0';
          span.style.filter = 'blur(4px)';
          span.style.transform = 'translate(' + rx + 'px, ' + ry + 'px) scale(0.2)';
        });

        void widgetCard.offsetWidth;

        iconBadge.style.transition = 'all 0.4s ease';
        iconBadge.style.opacity = '1';
        iconBadge.style.transform = 'scale(1)';

        chars.forEach(span => {
          const delay = Math.random() * 120;
          span.style.transition = 'transform 0.5s cubic-bezier(0, 1, 0.5, 1) ' + delay + 'ms, opacity 0.4s ease ' + delay + 'ms, filter 0.4s ease ' + delay + 'ms';
          span.style.opacity = '1';
          span.style.filter = 'blur(0px)';
          span.style.transform = 'translate(0px, 0px) scale(1)';
        });

        setTimeout(() => {
          widgetCard.classList.remove('is-shattering');
          isTransitioning = false;
        }, 600);
      }
    }

    function spawnDustParticles(color) {
      const rect = widgetCard.getBoundingClientRect();
      dustCanvas.width = rect.width * (window.devicePixelRatio || 1);
      dustCanvas.height = rect.height * (window.devicePixelRatio || 1);
      ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);

      particles = [];
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: 20 + Math.random() * (rect.width - 40),
          y: 20 + Math.random() * (rect.height - 30),
          vx: (Math.random() - 0.4) * 2.2,
          vy: (Math.random() - 0.5) * 1.8,
          size: 1.2 + Math.random() * 2,
          alpha: 0.9,
          decay: 0.02 + Math.random() * 0.015,
          color: Math.random() > 0.3 ? color : '#00FF66'
        });
      }
    }

    function triggerFragmentTransition() {
      if (isTransitioning || isFinished) return;
      isTransitioning = true;
      const nextIndex = currentIndex + 1;

      if (nextIndex >= TOPICS.length) {
        isFinished = true;
        isTransitioning = false;
        return;
      }

      widgetCard.classList.add('is-shattering');
      spawnDustParticles(TOPICS[currentIndex].particleColor);

      const chars = widgetCard.querySelectorAll('.frag-char');
      chars.forEach(span => {
        const delay = Math.random() * 100;
        const dx = (Math.random() - 0.5) * 70;
        const dy = (Math.random() - 0.5) * 50;
        span.style.transition = 'transform 0.45s ease-out ' + delay + 'ms, opacity 0.4s ease ' + delay + 'ms, filter 0.4s ease ' + delay + 'ms';
        span.style.opacity = '0';
        span.style.filter = 'blur(4px)';
        span.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(0.2)';
      });

      setTimeout(() => {
        renderTopic(nextIndex, true);
        if (TOPICS[nextIndex].isFinal) {
          isFinished = true;
          progressBar.style.width = '100%';
        }
      }, 550);
    }

    function animationLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (particles.length > 0) {
        ctx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;
          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1;
      }

      if (!isPaused && !isTransitioning && !isFinished && singleGroupWidth > 0 && maxTriggerDistance > 0) {
        if (pauseElapsed < INITIAL_PAUSE_SEC) {
          pauseElapsed += dt;
        } else {
          scrollX += SCROLL_SPEED * dt;
          topicScrollElapsed += dt;
          marqueeTrack.style.transform = 'translate3d(-' + Math.min(maxTriggerDistance, scrollX) + 'px, 0, 0)';
          
          const topicProgress = Math.min(1, topicScrollElapsed / topicScrollDuration);
          let currentGlobalPct = 0;

          if (currentIndex === 0) {
            // 預期動機：0% ~ 60%
            currentGlobalPct = topicProgress * 60;
          } else if (currentIndex === 1) {
            // 預期收益：60% ~ 100%
            currentGlobalPct = 60 + (topicProgress * 40);
          }

          progressBar.style.width = currentGlobalPct + '%';
          updateHeaderStatus(currentGlobalPct);
        }

        if (scrollX >= maxTriggerDistance) {
          triggerFragmentTransition();
        }
      }

      requestAnimationFrame(animationLoop);
    }

    // 精確日曆天數計算（2026/10/22 至 2026/12/01）
    function initCaseTimer() {
      const startDate = new Date(2026, 9, 22); // 10月22日
      const endDate = new Date(2026, 11, 1);   // 12月1日
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const oneDay = 24 * 60 * 60 * 1000;
      const elapsedDays = Math.floor((today - startDate) / oneDay) + 1;
      let daysCount = Math.max(1, elapsedDays);

      const remainingDays = Math.round((endDate - today) / oneDay);
      let daysRem = Math.max(0, remainingDays);

      const totalSpan = Math.round((endDate - startDate) / oneDay);
      let passedSpan = Math.round((today - startDate) / oneDay);
      let pct = Math.min(100, Math.max(0, Math.round((passedSpan / totalSpan) * 100)));

      const daysElapsedEl = document.getElementById('daysElapsed');
      const daysRemainingEl = document.getElementById('daysRemaining');
      const progressPercentText = document.getElementById('progressPercentText');
      const timelineFillBar = document.getElementById('timelineFillBar');
      const caseStatusPill = document.getElementById('caseStatusPill');
      const caseStatusDot = document.getElementById('caseStatusDot');
      const caseStatusText = document.getElementById('caseStatusText');
      const rightLabel = document.getElementById('rightLabel');
      const rightUnit = document.getElementById('rightUnit');
      const rightSub = document.getElementById('rightSub');

      if (today >= endDate) {
        daysElapsedEl.textContent = "恭喜";
        daysRemainingEl.textContent = "無罪";
        rightLabel.textContent = "結案狀態";
        rightUnit.textContent = "";
        rightSub.textContent = "嫌疑人無罪釋放";
        progressPercentText.textContent = "100%";
        timelineFillBar.style.width = "100%";

        caseStatusPill.className = "case-status-pill pill-finished";
        caseStatusDot.className = "status-dot-yellow";
        caseStatusText.textContent = "偵查完畢";
      } else {
        daysElapsedEl.textContent = daysCount;
        daysRemainingEl.textContent = daysRem;
        progressPercentText.textContent = pct + "%";
        timelineFillBar.style.width = pct + "%";
      }
    }

    renderTopic(0, false); // 預設從 [01] 推測動機開始（以「目標」開頭）
    initCaseTimer();
    requestAnimationFrame(animationLoop);

    widgetCard.addEventListener('mouseenter', () => { isPaused = true; });
    widgetCard.addEventListener('mouseleave', () => { isPaused = false; });
    widgetCard.addEventListener('click', (e) => {
      if (!e.target.classList.contains('dot') && !isFinished) triggerFragmentTransition();
    });

    restartBtn.addEventListener('click', () => {
      isFinished = false;
      renderTopic(0, true);
    });

    themeToggleBtn.addEventListener('click', () => {
      const body = document.body;
      if (body.classList.contains('force-dark')) {
        body.classList.remove('force-dark');
        body.classList.add('force-light');
      } else if (body.classList.contains('force-light')) {
        body.classList.remove('force-light');
      } else {
        body.classList.add('force-dark');
      }
    });

    window.addEventListener('resize', () => {
      if (!TOPICS[currentIndex].isFinal) recalculateScrollDistance();
    });
  </script>
</body>
</html>
